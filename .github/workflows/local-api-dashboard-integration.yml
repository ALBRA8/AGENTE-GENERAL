name: Local API + Dashboard Integration

on:
  push:
    branches: [phase-3-local-deployment-foundation]
  pull_request:
    branches: [front-2-dashboard-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-api-dashboard:
    name: Real browser-to-API integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"

      - name: Start real local API with test-only credentials
        env:
          ALBRA_PROVIDER_SETTINGS_TOKEN: ci-local-provider-settings-token-32chars
          ALBRA_CORS_ORIGINS: http://127.0.0.1:3000
        run: |
          nohup python -m uvicorn albra_seed.local_api:app --host 127.0.0.1 --port 8000 > /tmp/albra-local-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "Local API is healthy"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/albra-local-api.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build dashboard for the local API
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          NEXT_PUBLIC_ALLOWED_API_ORIGINS: http://127.0.0.1:8000
        run: npm run build

      - name: Install Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Verify real browser-to-API flow
        working-directory: dashboard
        env:
          CI: "true"
        run: npm run test:e2e -- --grep "real local API"
