name: NVIDIA GLM-5.3-Flash live integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvidia-live-integration:
    name: Live NVIDIA API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install OpenAI-compatible SDK
        run: python -m pip install "openai>=1.10.0"

      - name: Run live NVIDIA API integration test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          REQUIRE_NVIDIA_LIVE_TEST: "1"
        run: python -m pytest tests/llm_real/test_nvidia_glm_flash.py -q
