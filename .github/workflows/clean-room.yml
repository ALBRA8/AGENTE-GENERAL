# ALBRA AGENT SEED V1.0 — Clean-Room CI verification.
#
# This workflow runs the in-tree clean-room verification on a FRESH
# checkout + FRESH virtualenv + MULTIPLE Python versions, exercising
# the parts of the clean-room scope that `scripts/clean_room_verify.py`
# ALONE cannot verify (see docs/CLEANROOM.md §10.2 "What the script
# does NOT verify"):
#
#   - fresh git clone (actions/checkout@v4)
#   - fresh virtualenv per matrix cell
#   - `pip install -e .[dev]` from scratch (exercises pyproject.toml
#     install metadata + extras resolution + entry_points)
#   - multiple Python versions (3.10 / 3.11 / 3.12 matrix)
#
# The workflow is OPTIONAL — the seed does NOT depend on CI to be
# READY_TO_FREEZE. `scripts/clean_room_verify.py` is the canonical
# in-tree verification script; this workflow only adds the external
# pieces (clone / venv / multi-version). When run on a self-hosted CI,
# this workflow is the closest automated approximation of the manual
# procedure documented in docs/CLEANROOM.md §10.4.
#
# NOTE: real network A2A interop (cross-host) and external provider
# integration (OpenAI/Anthropic/etc.) are STILL out of scope — those
# require live credentials and a second deployed agent.

name: Clean-Room Verification

# Serialize runs per ref to avoid wasting runner minutes on superseded commits.
concurrency:
  group: clean-room-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, fix/windows-compat-grep-sqlite, front-2-acceptance-battery, front-2-dashboard-integration, "integrate/**"]
  pull_request:
    branches: [main, fix/windows-compat-grep-sqlite, front-2-acceptance-battery]
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:

# The workflow only needs to read repository contents; do not grant write access
# to the automatically provided token to test code from pull requests.
permissions:
  contents: read

jobs:
  clean-room:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Fresh clone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev + a2a + api extras (pip install -e .[dev,a2a,api])
        # This is the step the in-tree script CANNOT verify on its own
        # — it exercises pyproject.toml install metadata, optional-deps
        # resolution, and entry_points. The `a2a` extra pulls in httpx
        # so the A2A HTTP transport tests run (instead of skip) in CI.
        # The `api` extra pulls in fastapi+uvicorn so the REST route tests
        # also run (instead of skip).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,a2a,api]"

      - name: Verify pyproject.toml parses + optional-dependencies keys
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ImportError:  # Python 3.10
              import tomli as tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          opt = d["project"]["optional-dependencies"]
          expected = {"openai", "anthropic", "groq", "vector", "api",
                      "a2a", "otel", "dev", "all"}
          missing = expected - set(opt.keys())
          assert not missing, f"missing optional-dependencies: {missing}"
          print("optional-dependencies keys OK:", sorted(opt))
          PY

      - name: Ruff lint
        run: >-
          ruff check src/albra_seed/runtime/agent.py
          src/albra_seed/security/output_redaction.py
          tests/security/test_memory_persistence_redaction.py
          tests/security/test_memory_retrieval_limits.py
          tests/security/test_short_credential_redaction.py

      - name: Ruff format check
        run: >-
          ruff format --check src/albra_seed/security/output_redaction.py
          tests/security/test_memory_persistence_redaction.py
          tests/security/test_memory_retrieval_limits.py
          tests/security/test_short_credential_redaction.py

      - name: Mypy type check
        run: >-
          mypy src/albra_seed/runtime/agent.py
          src/albra_seed/memory/retriever.py
          src/albra_seed/security/output_redaction.py

      - name: Dependency vulnerability audit
        # Audit the resolved runtime + CI dependency environment, including transitive packages.
        # This does not replace a lockfile or a production-image/SBOM audit.
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0" pip-audit
          pip-audit

      - name: Clean-room verification
        # 16 real PASS/FAIL gates + 1 informational scope-doc check R
        # + 2 optional checks. Expected: required 17/17 + optional 2/2.
        run: |
          python scripts/clean_room_verify.py

      - name: Audit matrix (40/40 VERIFIED)
        run: |
          python scripts/audit_matrix.py

      - name: Genetic parity (106/106 DNA present)
        run: |
          python scripts/parity_check.py

      - name: Genetic contamination (0 critical findings)
        run: |
          python scripts/contamination_scan.py

      - name: Full test suite
        run: |
          python -m pytest tests/ -q

  windows-compat:
    name: Windows compatibility (targeted acceptance)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Fresh clone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,a2a,api]"

      - name: Security closure tests
        run: python -m pytest tests/security/test_security_closure.py -q

      - name: Ollama fail-closed test
        run: python -m pytest tests/unit/test_providers.py::test_ollama_provider_raises_if_not_configured -q

      - name: SQLite approvals tests
        run: python -m pytest tests/security/test_hitl_sqlite_store.py -q

      - name: HITL ledger and crash-recovery tests
        run: python -m pytest tests/security/test_hitl_runtime_dispatch_ledger.py -q


  dashboard-build:
    name: Dashboard production build and public-bundle secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fresh clone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install Chromium for browser acceptance
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser acceptance
        working-directory: dashboard
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Scan public bundle for credential-like patterns
        shell: bash
        run: |
          if grep -R -n -E 'ALBRA_PROVIDER_SETTINGS_TOKEN|NEXT_PUBLIC_ADMIN_TOKEN|nvapi-[A-Za-z0-9_-]{20,}' dashboard/.next/static; then
            echo "Potential secret-like value found in public dashboard assets" >&2
            exit 1
          fi
