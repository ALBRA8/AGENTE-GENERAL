name: HITL Regression

on:
  push:
    branches: [fix/hitl-deadline-guard]
    paths:
      - "src/albra_seed/approvals/**"
      - "src/albra_seed/runtime/agent.py"
      - "tests/security/test_approval_deadline_enforcement.py"
      - ".github/workflows/hitl-regression.yml"
  pull_request:
    branches: [feat/albra-universal-core, main]
    paths:
      - "src/albra_seed/approvals/**"
      - "src/albra_seed/runtime/agent.py"
      - "tests/security/test_approval_deadline_enforcement.py"
      - ".github/workflows/hitl-regression.yml"

permissions:
  contents: read

concurrency:
  group: hitl-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hitl-regression:
    name: HITL tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run HITL deadline and waiter regressions
        run: python -m pytest tests/security/test_approval_deadline_enforcement.py -q
      - name: Run full test suite
        run: python -m pytest tests/ -q
