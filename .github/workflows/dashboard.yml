name: Dashboard Build

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npx eslint src
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
